name: coffeeflow

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: coffeeflow-local:dev
  restart: unless-stopped
  environment: &app-env
    PORT: '3000'
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:3000/health/live').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 15s

services:
  gateway:
    <<: *app-base
    environment:
      <<: *app-env
      SERVICE_NAME: gateway
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3010}:3000"

  identity:
    <<: *app-base
    environment:
      <<: *app-env
      SERVICE_NAME: identity

  catalog:
    <<: *app-base
    environment:
      <<: *app-env
      SERVICE_NAME: catalog

  orders:
    <<: *app-base
    environment:
      <<: *app-env
      SERVICE_NAME: orders

  notifications:
    <<: *app-base
    environment:
      <<: *app-env
      SERVICE_NAME: notifications

  analytics:
    <<: *app-base
    environment:
      <<: *app-env
      SERVICE_NAME: analytics

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coffee}
      POSTGRES_DB: ${POSTGRES_DB:-coffeeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example before starting Compose}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
