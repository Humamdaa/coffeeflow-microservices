name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: format-lint-build-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prettier check
        run: npm run format:check
      - name: ESLint check
        run: npm run lint:check
      - name: Build all apps
        run: npm run build
      - name: Unit tests
        run: npm run test:unit